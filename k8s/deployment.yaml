apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-log-triage
  labels:
    app: ai-log-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-log-triage
  template:
    metadata:
      labels:
        app: ai-log-triage
    spec:
      containers:
        - name: app
          image: k8s-ai-log-triage:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-log-triage-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
